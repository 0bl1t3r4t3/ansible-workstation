---
# Tools come from this file (normally linked by the dotfiles role).
asdf_tool_versions: "{{ ansible_facts.user_dir }}/.tool-versions"
# Git URLs for plugins; needed for plugins not in asdf's short-name index.
asdf_plugin_urls: {}
# Install every version listed in asdf_tool_versions that is missing.
asdf_install_versions: true
asdf_data_dir: "{{ ansible_facts.user_dir }}/.asdf"

# Linux: asdf is rarely packaged, so the release binary is installed.
asdf_version: 0.20.2
asdf_bin_dir: "{{ ansible_facts.user_dir }}/.local/bin"
# Linux packages asdf plugins commonly need (downloads, unpacking)
asdf_linux_dependencies: [curl, git, tar, gzip, unzip]
