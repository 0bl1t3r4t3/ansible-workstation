---
- name: Parse tool versions
  ansible.builtin.set_fact:
    asdf_tools: "{{ asdf_file.content | b64decode | bwhitehead.workstation.parse_tool_versions }}"

- name: List installed plugins
  ansible.builtin.command: asdf plugin list
  environment: "{{ asdf_env }}"
  changed_when: false
  failed_when: false
  check_mode: false
  register: asdf_plugins

- name: Add missing plugins
  ansible.builtin.command:
    argv: "{{ ['asdf', 'plugin', 'add', item] + ([asdf_plugin_urls[item]] if item in asdf_plugin_urls else []) }}"
  environment: "{{ asdf_env }}"
  loop: "{{ asdf_tools.keys() | difference(asdf_plugins.stdout_lines | map('trim')) | sort }}"
  changed_when: true

# Check install folders directly: asdf's `current`/`list` output changes between versions.
- name: Check which versions are installed
  ansible.builtin.stat:
    path: "{{ asdf_data_dir }}/installs/{{ item.key }}/{{ item.value }}"
  loop: "{{ asdf_tools | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"
  register: asdf_installed
  when: asdf_install_versions | bool

- name: Install missing versions
  ansible.builtin.command:
    argv: [asdf, install, "{{ item.item.key }}", "{{ item.item.value }}"]
    chdir: "{{ asdf_tool_versions | dirname }}"
  environment: "{{ asdf_env }}"
  loop: "{{ asdf_installed.results | rejectattr('skipped', 'defined') | rejectattr('stat.exists') }}"
  loop_control:
    label: "{{ item.item.key }} {{ item.item.value }}"
  changed_when: true
  when: asdf_install_versions | bool
