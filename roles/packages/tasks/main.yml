---
# Each enabled group in packages_groups adds to the matching packages_* lists.
- name: Merge the enabled package groups
  ansible.builtin.set_fact:
    packages_all: >-
      {{ {'common': packages_common, 'homebrew_taps': packages_homebrew_taps,
          'homebrew_formulae': packages_homebrew_formulae, 'homebrew_casks': packages_homebrew_casks,
          'homebrew_pinned': packages_homebrew_pinned, 'linux': packages_linux,
          'flatpaks': packages_flatpaks, 'winget': packages_winget}
         | bwhitehead.workstation.package_groups(packages_groups, packages_group_definitions) }}

- name: Resolve package names for {{ ansible_facts.os_family }}
  ansible.builtin.set_fact:
    packages_resolved: >-
      {{ packages_all.common | bwhitehead.workstation.os_packages(
           ansible_facts.os_family,
           packages_default_name_map | combine(packages_name_map, recursive=true),
           require_mapping=(ansible_facts.os_family == 'Windows')) }}
    packages_state: "{{ 'latest' if packages_upgrade | bool else 'present' }}"

- name: Install macOS packages
  ansible.builtin.include_tasks: darwin.yml
  when: ansible_facts.os_family == 'Darwin'

- name: Install Linux packages
  ansible.builtin.include_tasks: linux.yml
  when: ansible_facts.system == 'Linux'

- name: Install Windows packages
  ansible.builtin.include_tasks: windows.yml
  when: ansible_facts.os_family == 'Windows'
