---
- name: Check for Homebrew
  ansible.builtin.stat:
    path: "{{ packages_homebrew_prefix }}/bin/brew"
  register: packages_brew

- name: Require Homebrew
  ansible.builtin.assert:
    that: packages_brew.stat.exists
    fail_msg: >-
      Homebrew not found at {{ packages_homebrew_prefix }}. Run scripts/bootstrap.sh
      (or install from https://brew.sh) first.
    quiet: true

- name: Add Homebrew taps
  community.general.homebrew_tap:
    name: "{{ packages_homebrew_taps }}"
    path: "{{ packages_homebrew_prefix }}/bin"
  when: packages_homebrew_taps | length > 0

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ (packages_resolved + packages_homebrew_formulae + packages_homebrew_pinned) | unique }}"
    state: "{{ packages_state }}"
    path: "{{ packages_homebrew_prefix }}/bin"
  when: (packages_resolved + packages_homebrew_formulae + packages_homebrew_pinned) | length > 0

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ packages_homebrew_casks }}"
    state: "{{ 'upgraded' if packages_upgrade | bool else 'present' }}"
    path: "{{ packages_homebrew_prefix }}/bin"
  when: packages_homebrew_casks | length > 0

# Pinned formulae are skipped by `brew upgrade`. Use it for libraries that
# source-built formulae link against (e.g. tree-sitter for emacs-plus), where an
# upgrade breaks the app until it is rebuilt. Pins are added, never removed.
- name: List pinned Homebrew formulae
  ansible.builtin.command:
    argv: ["{{ packages_homebrew_prefix }}/bin/brew", list, --pinned]
  register: packages_brew_pinned_now
  changed_when: false
  check_mode: false
  when: packages_homebrew_pinned | length > 0

- name: Pin Homebrew formulae
  ansible.builtin.command:
    argv: ["{{ packages_homebrew_prefix }}/bin/brew", pin, "{{ item }}"]
  loop: "{{ packages_homebrew_pinned | difference(packages_brew_pinned_now.stdout_lines | default([])) }}"
  changed_when: true
  when: packages_homebrew_pinned | length > 0
