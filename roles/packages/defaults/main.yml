---
# Cross-OS packages by generic name; translated per OS family through
# packages_default_name_map (vars/main.yml) merged with packages_name_map.
packages_common: []

# Extra or overriding translations: {generic: {Darwin|Debian|RedHat|Archlinux|Suse: name}}.
# An empty string skips the package on that OS family.
packages_name_map: {}

# macOS (Homebrew)
packages_homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts.architecture == 'arm64' else '/usr/local' }}"
packages_homebrew_taps: []
packages_homebrew_formulae: []
packages_homebrew_casks: []

# Linux native packages, in addition to packages_common
packages_linux: []      # any distro
packages_debian: []     # Debian, Ubuntu, ...
packages_redhat: []     # Fedora, RHEL, Rocky, Alma, ...
packages_archlinux: []
packages_suse: []

# Linux Flatpak apps (GUI apps; the Linux counterpart of casks)
packages_flatpaks: []
packages_flatpak_remote: flathub
packages_flatpak_remote_url: https://dl.flathub.org/repo/flathub.flatpakrepo

# false = install missing packages only; true = also upgrade them
packages_upgrade: false
