---
- name: Check for git and stow
  ansible.builtin.shell: command -v git && command -v stow
  changed_when: false
  failed_when: false
  check_mode: false
  register: dotfiles_deps

- name: Install git and stow
  when:
    - dotfiles_install_deps | bool
    - dotfiles_deps.rc != 0
  block:
    - name: Install git and stow (Homebrew)
      community.general.homebrew:
        name: [git, stow]
        path: "{{ '/opt/homebrew/bin' if ansible_facts.architecture == 'arm64' else '/usr/local/bin' }}"
      when: ansible_facts.os_family == 'Darwin'

    - name: Install git and stow
      ansible.builtin.package:
        name: [git, stow]
      become: true
      when: ansible_facts.system == 'Linux'

- name: Clone dotfiles
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    version: "{{ dotfiles_version }}"
    update: "{{ dotfiles_update | bool }}"
  register: dotfiles_clone

- name: Find stow packages
  ansible.builtin.find:
    paths: "{{ dotfiles_dest }}"
    file_type: directory
    hidden: false
  register: dotfiles_found
  when: dotfiles_packages | length == 0

- name: Choose stow packages
  ansible.builtin.set_fact:
    dotfiles_stow: >-
      {{ dotfiles_packages if dotfiles_packages | length > 0
         else dotfiles_found.files | map(attribute='path') | map('basename') | sort }}

- name: Back up files that would block linking
  ansible.builtin.include_tasks: backup.yml
  when:
    - dotfiles_backup_conflicts | bool
    - not (ansible_check_mode and dotfiles_clone is changed)

# Stow prints a LINK line for each link it would create; existing correct links are silent.
- name: Check which links are missing
  ansible.builtin.command:
    argv: "{{ ['stow', '--no', '--verbose=1', '--target=' ~ dotfiles_target] + dotfiles_stow }}"
    chdir: "{{ dotfiles_dest }}"
  changed_when: false
  failed_when: false
  check_mode: false
  register: dotfiles_plan
  when: not (ansible_check_mode and dotfiles_clone is changed)

- name: Stop on conflicts
  ansible.builtin.fail:
    msg: |
      Stow found files that are in the way. Move them aside (or into the repo) and re-run:
      {{ dotfiles_plan.stderr }}
  when:
    - dotfiles_plan.rc is defined
    - dotfiles_plan.rc != 0

- name: Link dotfiles
  ansible.builtin.command:
    argv: "{{ ['stow', '--verbose=1', '--target=' ~ dotfiles_target] + dotfiles_stow }}"
    chdir: "{{ dotfiles_dest }}"
  changed_when: true
  when:
    - dotfiles_plan.stderr is defined
    - "'LINK:' in dotfiles_plan.stderr"
