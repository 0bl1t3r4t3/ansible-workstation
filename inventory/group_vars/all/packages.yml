---
# Profile for my workstations. Generic names work on every OS (see roles/packages/vars/main.yml).
packages_common:
  - bash
  - bash-completion
  - git
  - git-lfs
  - stow
  - curl
  - wget
  - jq
  - ripgrep
  - fd
  - fzf
  - bat
  - direnv
  - shellcheck
  - shfmt
  - pipx
  - gitleaks
  - starship
  - coreutils
  - gnu-sed
  - grep
  - gawk
  - util-linux

packages_name_map:
  # Not in Debian/Fedora repos (gitleaks) or installed by the shell role (starship).
  gitleaks: {Debian: "", RedHat: ""}
  starship: {Debian: "", RedHat: "", Archlinux: starship, Suse: ""}

# Package groups to install (defined in package_groups.yml). This default is a
# development / sysadmin workstation. Add groups per machine in its own vars,
# e.g. inventory/local.yml:  packages_groups: [core, editors, dev, ..., media]
# Available: core, editors, dev, docs, sysadmin, cloud, virt, security, data,
#            media, personal
packages_groups:
  - core
  - editors
  - dev
  - docs
  - sysadmin
  - cloud
  - virt

# Uninstalled wherever this runs (security or superseded):
packages_homebrew_absent:
  - telnet                     # cleartext logins; use ssh, or `nc` for port checks
  - ncftp                      # cleartext FTP; use sftp / scp / rsync
  - cirruslabs/cli/sshpass     # passwords on the command line; use SSH keys
  - minacle/chntpw/chntpw      # Windows password-reset tool; not a workstation tool
  - bcrypt                     # Blowfish file encryption, unmaintained; use age or gpg
  - beecrypt                   # crypto library, unmaintained since 2009
  - python@3.12                # keep only the newest Python + one prior (3.15, 3.14)
  - python@3.11
