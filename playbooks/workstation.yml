---
# Hosts can be macOS, Linux (including WSL) or Windows (over SSH, shell=powershell).
- name: Set up workstation
  hosts: all
  gather_facts: true
  roles:
    - role: bwhitehead.workstation.packages
      tags: [packages]
    - role: bwhitehead.workstation.dotfiles
      tags: [dotfiles]
    - role: bwhitehead.workstation.shell
      tags: [shell]
    - role: bwhitehead.workstation.asdf
      tags: [asdf]
      when: ansible_facts.os_family != 'Windows'   # asdf has no Windows support; WSL gets it
    - role: bwhitehead.workstation.macos_defaults
      tags: [macos]
      when: ansible_facts.os_family == 'Darwin'
    - role: bwhitehead.workstation.windows_settings
      tags: [windows]
      when: ansible_facts.os_family == 'Windows'
    - role: bwhitehead.workstation.wsl
      tags: [windows, wsl]
      when: ansible_facts.os_family == 'Windows'
